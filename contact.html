<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Decider Machine</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <style>
        .contact-hero { padding: 120px 0 60px; text-align: center; }
        .contact-hero h1 { font-family: var(--font-display); font-size: 3.5rem; color: var(--white); margin-bottom: 15px; }
        .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; margin-bottom: 80px; }
        .contact-info { background: var(--card-bg); padding: 40px; border-radius: var(--radius); border: 1px solid var(--card-border); }
        .info-item { margin-bottom: 30px; }
        .info-item h3 { font-family: var(--font-display); color: var(--primary); margin-bottom: 5px; font-size: 1.2rem; }
        .info-item p { color: var(--text-muted); }
        .contact-form { background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: var(--radius); border: 1px solid var(--card-border); backdrop-filter: blur(10px); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; color: var(--white); margin-bottom: 8px; font-weight: 700; }
        .form-group input, .form-group textarea { width: 100%; padding: 15px; border-radius: var(--radius-sm); border: 1px solid var(--card-border); background: var(--bg2); color: var(--white); font-family: var(--font-body); outline: none; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="header-root"></div>

    <section class="container">
        <div class="contact-hero">
            <h1>Get In <span>Touch</span></h1>
            <p style="color: var(--text-muted)">Have a feature request or need professional web development services? Let's talk.</p>
        </div>

        <div class="contact-grid">
            <div class="contact-info">
                <div class="info-item">
                    <h3>Email Me</h3>
                    <p>nolushac@gmail.com</p>
                </div>
                <div class="info-item">
                    <h3>Founder</h3>
                    <p>Waqas Bukhari</p>
                </div>
                <div class="info-item">
                    <h3>Expertise</h3>
                    <p>Web Development, SEO Strategy, UI/UX Design</p>
                </div>
                <div class="info-item">
                    <h3>Response Time</h3>
                    <p>Usually within 24-48 hours</p>
                </div>
            </div>

            <form class="contact-form" action="https://formspree.io/f/YOUR_ID" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="5" placeholder="How can I help you?" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%">🚀 Send Message</button>
            </form>
        </div>
    </section>

    <div id="footer-root"></div>
    <script src="components.js"></script>
    <script>initComponents();</script>
</body>
</html>
